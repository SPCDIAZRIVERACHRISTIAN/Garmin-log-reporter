[package]
name = "garmin_cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "garmin-log"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
garmin_core = { path = "../garmin_core" }
garmin_parser = { path = "../garmin_parser" }
storage = { path = "../storage" }
analytics = { path = "../analytics" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
